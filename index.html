<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Fast Fruit</title>
  <meta name="description" content="A physics racing game about melons, momentum, and arriving at the wrong angle. Race the pack, smash spectacularly, beat your friends' ghosts." />

  <!-- LAUNCH TODO: replace SITE_URL below with your deployed URL
       (e.g. https://yourname.github.io/fast-fruit/) in all og:/twitter: tags.
       Preview images MUST be absolute URLs or messengers ignore them. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fast Fruit" />
  <meta property="og:description" content="Melon racing with real physics. Hold to roll. Try not to explode. Beat my ghost." />
  <meta property="og:url" content="SITE_URL/" />
  <meta property="og:image" content="SITE_URL/icons/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Fast Fruit" />
  <meta name="twitter:description" content="Melon racing with real physics. Beat my ghost." />
  <meta name="twitter:image" content="SITE_URL/icons/og.png" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script>
    // PWA dressing only when actually served: on file:// the manifest
    // fetch trips CORS (origin null) and logs a console error, and
    // service workers can't register anyway. file:// must run CLEAN.
    if (location.protocol !== 'file:') {
      const l = document.createElement('link');
      l.rel = 'manifest'; l.href = 'manifest.webmanifest';
      document.head.appendChild(l);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD: read-only telemetry. Renderer never touches this; hud.js owns it. -->
  <div id="hud" aria-hidden="true">
    <div class="hud-row"><span class="hud-label">time</span><span id="hud-time">0:00.0</span></div>
    <div class="hud-row cockpit-only"><span class="hud-label">dist</span><span id="hud-dist">0.0 m</span></div>
    <div class="hud-row cockpit-only"><span class="hud-label">speed</span><span id="hud-speed">0.0</span></div>
    <div class="hud-row cockpit-only"><span class="hud-label">spin</span><span id="hud-spin">0.0</span></div>
    <div class="hud-row cockpit-only"><span class="hud-label">impact</span><span id="hud-impact">—</span></div>
    <div class="hud-row cockpit-only"><span class="hud-label">vs bot</span><span id="hud-bot">—</span></div>
    <div class="hud-row"><span class="hud-label">lap</span><span id="hud-lap">—</span></div>
    <div class="hud-row"><span class="hud-label">last</span><span id="hud-last">—</span></div>
    <div class="hud-row"><span class="hud-label">best</span><span id="hud-best">—</span></div>
  </div>

  <!-- Debug tuning panel mounts here; built by debug.js from CONFIG schema -->
  <div id="debug-root"></div>

  <!-- Quick respawn: back to track start -->

  <!-- Touch hint, fades after first input -->
  <div id="touch-hint">
    <span class="hint-left">◀ drag to spin ▶</span>
    <span class="hint-right">▲ bouncy &nbsp; dead ▼</span>
  </div>

  <!-- Classic scripts, no modules: load order IS the dependency order. -->
  <script src="js/type.js"></script>
  <script src="js/devtools.js"></script>
  <script src="js/dmath.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fruits.js"></script>
  <script src="js/state.js"></script>
  <script src="js/melon.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/strand.js"></script>
  <script src="js/slab.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/debris.js"></script>
  <script src="js/billboards.js"></script>
  <script src="js/boards.js"></script>
  <script src="js/events.js"></script>
  <script src="js/damage.js"></script>
  <script src="js/pilot.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/input.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/shading.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/names.js"></script>
  <script src="js/roster.js"></script>
  <script src="js/decals.js"></script>
  <script src="js/xp.js"></script>
  <script src="js/emote.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/deaths.js"></script>
  <script src="js/ghost.js"></script>
  <script src="js/net.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/autopilot.js"></script>
  <script src="js/exhibition.js"></script>
  <script src="js/racewatch.js"></script>
  <script src="js/ticker.js"></script>
  <script src="js/gridstart.js"></script>
  <script src="js/finishline.js"></script>
  <script src="js/cup.js"></script>
  <script src="js/resume.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/main.js"></script>
  <script src="js/mp.js"></script>
<script>
  // PWA: offline play + home-screen install. Network-first, so deploys
  // are always fresh online; the cache only answers when offline.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
