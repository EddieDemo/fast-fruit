<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Fast Fruit — Stage 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD: read-only telemetry. Renderer never touches this; hud.js owns it. -->
  <div id="hud" aria-hidden="true">
    <div class="hud-row"><span class="hud-label">speed</span><span id="hud-speed">0.0</span></div>
    <div class="hud-row"><span class="hud-label">spin</span><span id="hud-spin">0.0</span></div>
    <div class="hud-row"><span class="hud-label">impact</span><span id="hud-impact">—</span></div>
  </div>

  <!-- Debug tuning panel mounts here; built by debug.js from CONFIG schema -->
  <div id="debug-root"></div>

  <!-- Touch hint, fades after first input -->
  <div id="touch-hint">
    <span class="hint-left">◀ hold to spin left</span>
    <span class="hint-right">hold to spin right ▶</span>
  </div>

  <!-- Classic scripts, no modules: load order IS the dependency order. -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
