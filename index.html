<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Fast Fruit — Stage 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD: read-only telemetry. Renderer never touches this; hud.js owns it. -->
  <div id="hud" aria-hidden="true">
    <div class="hud-row"><span class="hud-label">time</span><span id="hud-time">0:00.0</span></div>
    <div class="hud-row"><span class="hud-label">dist</span><span id="hud-dist">0.0 m</span></div>
    <div class="hud-row"><span class="hud-label">speed</span><span id="hud-speed">0.0</span></div>
    <div class="hud-row"><span class="hud-label">spin</span><span id="hud-spin">0.0</span></div>
    <div class="hud-row"><span class="hud-label">impact</span><span id="hud-impact">—</span></div>
    <div class="hud-row"><span class="hud-label">vs bot</span><span id="hud-bot">—</span></div>
    <div class="hud-row"><span class="hud-label">lap</span><span id="hud-lap">—</span></div>
    <div class="hud-row"><span class="hud-label">last</span><span id="hud-last">—</span></div>
    <div class="hud-row"><span class="hud-label">best</span><span id="hud-best">—</span></div>
  </div>

  <!-- Debug tuning panel mounts here; built by debug.js from CONFIG schema -->
  <div id="debug-root"></div>

  <!-- Quick respawn: back to track start -->
  <button id="respawn-btn" aria-label="Respawn at start">&#8634;</button>

  <!-- Touch hint, fades after first input -->
  <div id="touch-hint">
    <span class="hint-left">◀ hold to spin left</span>
    <span class="hint-right">hold to spin right ▶</span>
  </div>

  <!-- Classic scripts, no modules: load order IS the dependency order. -->
  <script src="js/dmath.js"></script>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/debris.js"></script>
  <script src="js/billboards.js"></script>
  <script src="js/boards.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/names.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/net.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/main.js"></script>
  <script src="js/mp.js"></script>
</body>
</html>
